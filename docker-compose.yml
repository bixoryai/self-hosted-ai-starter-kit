volumes:
  n8n_storage:
    external: true
    name: self-hosted-n8n_n8n_storage
  postgres_storage:
    external: true
    name: self-hosted-n8n_postgres17_storage
  # ollama_storage:  # Not needed - Ollama runs on Windows host
  qdrant_storage:
    external: true
    name: self-hosted-n8n_qdrant_storage

networks:
  local-n8n:
    name: local-n8n

x-n8n: &service-n8n
  image: n8nio/n8n:2.36.0
  networks: ['local-n8n']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
  env_file:
    - path: .env
      required: true

